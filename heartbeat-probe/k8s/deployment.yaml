# GKE example. stdout goes straight to Cloud Logging - NOT through your OTel/Loki pipeline.
# StatefulSet gives stable replica names (heartbeat-probe-0, -1, ...), which keeps
# Mimir series and the per-replica GCP absence alerts stable across restarts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: heartbeat-probe
data:
  config.yaml: |
    # paste your config.yaml here (same file you pass to render.py)
---
apiVersion: v1
kind: Secret
metadata:
  name: heartbeat-probe
type: Opaque
stringData:
  WEBHOOK_TOKEN: "change-me"          # same value as HEARTBEAT_WEBHOOK_TOKEN on Grafana
  GRAFANA_TOKEN: "change-me"          # Grafana service account, Viewer on the probe datasources
  OTLP_HEADERS_TEAM_A: "Authorization=Basic%20BASE64_TEAM_A"   # %20 = space (OTel header format)
  OTLP_HEADERS_TEAM_B: "Authorization=Basic%20BASE64_TEAM_B"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: heartbeat-probe
spec:
  replicas: 2
  serviceName: heartbeat-probe-headless
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app: heartbeat-probe }
  template:
    metadata:
      labels: { app: heartbeat-probe }
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app: heartbeat-probe }
      containers:
        - name: heartbeat-probe   # GCP filters on this container name (gcp.log_scope)
          image: REGISTRY/heartbeat-probe:2.0.0
          ports:
            - containerPort: 8080
          env:
            - name: REPLICA_ID
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - { name: PROBE_CONFIG, value: /etc/heartbeat-probe/config.yaml }
          envFrom:
            - secretRef: { name: heartbeat-probe }
          volumeMounts:
            - { name: config, mountPath: /etc/heartbeat-probe, readOnly: true }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
      volumes:
        - name: config
          configMap: { name: heartbeat-probe }
---
apiVersion: v1
kind: Service
metadata:
  name: heartbeat-probe-headless
spec:
  clusterIP: None
  selector: { app: heartbeat-probe }
  ports:
    - port: 8080
---
# Webhook entry point: load-balanced across all replicas (any replica validates any alert).
apiVersion: v1
kind: Service
metadata:
  name: heartbeat-probe
spec:
  selector: { app: heartbeat-probe }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: heartbeat-probe
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: heartbeat-probe }
# Expose the `heartbeat-probe` Service to the Grafana alerting instances (internal LB / Ingress) - not shown.
