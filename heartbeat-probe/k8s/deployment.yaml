# GKE example: two independent probe instances, one Pod each, in different zones.
# The two Deployments/Services differ only in the instance name (e2e-a / e2e-b).
# stdout goes straight to Cloud Logging - NOT through your OTel/Loki pipeline.
apiVersion: v1
kind: ConfigMap
metadata:
  name: heartbeat-probe
data:
  config.yaml: |
    # paste your config.yaml here (the same file you pass to render.py)
---
apiVersion: v1
kind: Secret
metadata:
  name: heartbeat-probe
type: Opaque
stringData:
  GRAFANA_TOKEN: "change-me"          # Grafana service account, Viewer on the probe datasources
  OTLP_HEADERS_TEAM_A: "Authorization=Basic%20BASE64_TEAM_A"   # %20 = space (OTel header format)
  OTLP_HEADERS_TEAM_B: "Authorization=Basic%20BASE64_TEAM_B"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heartbeat-probe-e2e-a
spec:
  replicas: 1                         # one process per instance: it owns its checks
  strategy:
    type: Recreate                    # never two Pods of the same instance at once
  selector:
    matchLabels: { app: heartbeat-probe, probe-instance: e2e-a }
  template:
    metadata:
      labels: { app: heartbeat-probe, probe-instance: e2e-a }
    spec:
      affinity:
        podAntiAffinity:              # every instance in a different zone
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: topology.kubernetes.io/zone
              labelSelector:
                matchLabels: { app: heartbeat-probe }
      terminationGracePeriodSeconds: 30
      containers:
        - name: heartbeat-probe       # GCP filters on this container name (gcp.log_scope)
          image: REGISTRY/heartbeat-probe:3.1.0
          ports:
            - containerPort: 8080
          env:
            - { name: PROBE_INSTANCE, value: e2e-a }
            - { name: PROBE_CONFIG, value: /etc/heartbeat-probe/config.yaml }
          envFrom:
            - secretRef: { name: heartbeat-probe }
          volumeMounts:
            - { name: config, mountPath: /etc/heartbeat-probe, readOnly: true }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
      volumes:
        - name: config
          configMap: { name: heartbeat-probe }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heartbeat-probe-e2e-b
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: heartbeat-probe, probe-instance: e2e-b }
  template:
    metadata:
      labels: { app: heartbeat-probe, probe-instance: e2e-b }
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: topology.kubernetes.io/zone
              labelSelector:
                matchLabels: { app: heartbeat-probe }
      terminationGracePeriodSeconds: 30
      containers:
        - name: heartbeat-probe
          image: REGISTRY/heartbeat-probe:3.1.0
          ports:
            - containerPort: 8080
          env:
            - { name: PROBE_INSTANCE, value: e2e-b }
            - { name: PROBE_CONFIG, value: /etc/heartbeat-probe/config.yaml }
          envFrom:
            - secretRef: { name: heartbeat-probe }
          volumeMounts:
            - { name: config, mountPath: /etc/heartbeat-probe, readOnly: true }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
      volumes:
        - name: config
          configMap: { name: heartbeat-probe }
---
# Each instance has its own Service = its own webhook URL (instances[].webhook_url).
apiVersion: v1
kind: Service
metadata:
  name: heartbeat-probe-e2e-a
spec:
  selector: { app: heartbeat-probe, probe-instance: e2e-a }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: heartbeat-probe-e2e-b
spec:
  selector: { app: heartbeat-probe, probe-instance: e2e-b }
  ports:
    - port: 80
      targetPort: 8080
