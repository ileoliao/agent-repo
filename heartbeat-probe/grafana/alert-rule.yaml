# Grafana file provisioning: put under provisioning/alerting/
# Requires a Grafana version that supports per-rule notification_settings
# (simplified routing). Without it, remove that block and add a child policy
# matching probe=e2e -> heartbeat-probe-webhook in the UI with the same timings.
apiVersion: 1
groups:
  - orgId: 1
    name: e2e-heartbeat
    folder: Platform Heartbeat
    interval: 30s
    rules:
      - uid: e2e-heartbeat-probe
        title: E2E Heartbeat Probe
        condition: C
        data:
          # A: probe state, only if the series is fresh (< 90s old).
          # A stale series returns nothing -> no firing -> GCP sees the gap.
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: MIMIR_DATASOURCE_UID          # TODO: datasource of the probe's tenant
            model:
              refId: A
              instant: true
              expr: |
                max(heartbeat_probe_state{probe="e2e"})
                and on()
                (time() - max(timestamp(heartbeat_probe_state{probe="e2e"})) < 90)
          # B: probe ID, echoed back through the annotation.
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: MIMIR_DATASOURCE_UID
            model:
              refId: B
              instant: true
              expr: max(heartbeat_probe_id{probe="e2e"})
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        # Any failure must result in SILENCE, never a fake notification:
        # the probe only counts a matched webhook as success.
        noDataState: OK
        execErrState: OK
        for: 0s
        labels:
          probe: e2e
        annotations:
          # %.0f keeps every digit; default formatting would be 1.76e+09 and never match.
          probe_id: '{{ printf "%.0f" $values.B.Value }}'
          summary: End-to-end heartbeat probe (expected to fire every cycle; not an incident)
        notification_settings:
          receiver: heartbeat-probe-webhook
          group_by: [alertname, probe]
          group_wait: 0s
          group_interval: 30s
          repeat_interval: 4h
