# Grafana file provisioning: put under provisioning/alerting/
# Adds one webhook contact point. Does NOT touch the notification policy tree.
apiVersion: 1
contactPoints:
  - orgId: 1
    name: heartbeat-probe-webhook
    receivers:
      - uid: heartbeat-probe-webhook
        type: webhook
        disableResolveMessage: false        # resolved notifications are paired too
        settings:
          url: https://heartbeat-probe.example.internal/webhook   # TODO: reachable from the Grafana alerting instances
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: $HEARTBEAT_WEBHOOK_TOKEN     # env var on the Grafana pods
