# Optional overlay for processes.yaml, loaded only when PROCESS_EXCLUDE_REGEX is non-empty.
# Whitelist = what to keep (PROCESS_ALLOW_REGEX, filter/process_allow); blacklist = what to explicitly drop
# (this file, filter/process_exclude), applied to what the whitelist let through. Kernel threads are NOT
# handled here: they are always excluded at scrape time by the `exclude` list in processes.yaml.
# Pipeline lists are replaced, not merged, so this repeats the one in processes.yaml with the exclude filter
# added right after the allowlist: keep both in sync when changing either.
processors:
  filter/process_exclude:
    error_mode: ignore
    metrics:
      metric:
        - 'IsMatch(name, "^process\\.") and IsMatch(resource.attributes["process.executable.name"], "${env:PROCESS_EXCLUDE_REGEX}")'

service:
  pipelines:
    metrics:
      processors: [memory_limiter, filter/process_allow, filter/process_exclude, transform/process_identity, groupbyattrs/processes, metrics_transform/sum_processes, transform/process_labels, resource_detection, resource/identity, transform/host_labels, batch]
