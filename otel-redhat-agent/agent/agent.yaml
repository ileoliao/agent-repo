# Host agent base: host metrics -> central collector over OTLP/HTTP.
# Per-host values come from /etc/otelcol-contrib/otelcol-contrib.conf (systemd EnvironmentFile).
# Optional fragments loaded on top: auth.yaml, processes.yaml, logs-journald.yaml, logs-files.yaml.
receivers:
  host_metrics:
    collection_interval: 30s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization: {enabled: true}
      memory:
        metrics:
          system.memory.utilization: {enabled: true}
      # Cardinality guards: drop sources that churn or add series per container/mount
      disk:
        exclude:
          devices: ['^(loop|ram|zram|sr|fd)[0-9]+$']
          match_type: regexp
      filesystem:
        exclude_fs_types:
          fs_types: [autofs, binfmt_misc, bpf, cgroup, cgroup2, configfs, debugfs, devpts, devtmpfs, fusectl, hugetlbfs, iso9660, mqueue, nsfs, overlay, proc, pstore, rpc_pipefs, securityfs, selinuxfs, squashfs, sysfs, tmpfs, tracefs]
          match_type: strict
        exclude_mount_points:
          mount_points: ['^/(dev|proc|sys|run)($|/)', '^/var/lib/(docker|containers|kubelet)/']
          match_type: regexp
      network:
        exclude:
          interfaces: ['^(lo|veth.*|docker.*|br-.*|cni.*|cali.*|flannel.*|cilium.*|lxc.*|virbr.*|vnet.*)$']
          match_type: regexp
      load:
      paging:
      processes:

processors:
  memory_limiter:
    check_interval: 1s
    # 55% of AGENT_MEMORY_MAX, set in the unit drop-in (limit_percentage would use host memory, not the
    # cgroup limit); spike defaults to 20% of it. Stays below GOMEMLIMIT / MemoryHigh / MemoryMax.
    limit_mib: ${env:MEMORY_LIMIT_MIB}
  # env first: HOST_ATTRIBUTES (OTEL_RESOURCE_ATTRIBUTES) win over detected values
  resource_detection:
    detectors: [env, system]
    system:
      hostname_sources: [os]
      resource_attributes:
        host.id: {enabled: true}
        host.arch: {enabled: true}
        os.description: {enabled: true}
  # service.instance.id = host.name becomes the "instance" label in Mimir/Prometheus; without it all
  # hosts sharing a service.name would write into the same series
  resource/identity:
    attributes:
      - {key: service.name, value: "${env:SERVICE_NAME}", action: insert}
      - {key: service.instance.id, from_attribute: host.name, action: insert}
  # Host attributes as labels on every metric data point, so the backend needs no resource-attribute
  # promotion (and they survive a backend that drops target_info). Constant per host: no extra series.
  transform/host_labels:
    error_mode: ignore
    metric_statements:
      - context: datapoint
        statements:
          - set(datapoint.attributes["host.name"], resource.attributes["host.name"]) where resource.attributes["host.name"] != nil
          - set(datapoint.attributes["deployment.environment.name"], resource.attributes["deployment.environment.name"]) where resource.attributes["deployment.environment.name"] != nil
          - set(datapoint.attributes["team"], resource.attributes["team"]) where resource.attributes["team"] != nil
          - set(datapoint.attributes["business_line"], resource.attributes["business_line"]) where resource.attributes["business_line"] != nil
          - set(datapoint.attributes["role"], resource.attributes["role"]) where resource.attributes["role"] != nil
          - set(datapoint.attributes["region"], resource.attributes["region"]) where resource.attributes["region"] != nil
  batch:
    send_batch_size: 1024
    timeout: 10s

exporters:
  otlp_http:
    endpoint: ${env:COLLECTOR_ENDPOINT}

service:
  pipelines:
    metrics:
      receivers: [host_metrics]
      processors: [memory_limiter, resource_detection, resource/identity, transform/host_labels, batch]
      exporters: [otlp_http]
  telemetry:
    logs:
      level: info
