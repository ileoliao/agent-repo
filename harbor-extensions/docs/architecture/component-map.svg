<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="940" viewBox="0 0 1240 940" role="img" aria-label="Component map: browser portal and sandboxed extension, CLI, Harbor gateway pipeline, platform dependencies, upstream systems, and the Git control plane">
    <style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap');
text{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.t-zone{font-size:12px;letter-spacing:.1em;fill:#56636f;font-weight:600}
.t-h{font-size:14px;font-weight:600;fill:#14212b}
.t-d{font-size:12px;fill:#56636f}
.t-gh{font-size:13px;font-weight:600;fill:#eef3f6}
.t-gd{font-size:12px;fill:#a9bccb}
.t-lbl{font-size:11.5px;fill:#0f6b74;font-weight:500}
.t-warn{font-size:12px;fill:#b4581d;font-weight:600}
.zone{fill:#e9edef;stroke:#cfd5da}
.box{fill:#ffffff;stroke:#cfd5da}
.box-accent{fill:#d8eef0;stroke:#0f6b74;stroke-width:1.5}
.box-untrusted{fill:#fbeadf;stroke:#b4581d;stroke-width:1.5;stroke-dasharray:6 4}
.gate{fill:#0c2233}
.step{fill:#16354f}
.step-hi{fill:#0f6b74}
.flow{stroke:#0f6b74;stroke-width:2;fill:none}
.flow-dash{stroke:#56636f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#0f6b74} .ah-m{fill:#56636f}
</style>
<rect width="1240" height="940" fill="#ffffff"/>
<defs>
      <marker id="a" orient="auto" markerWidth="5" markerHeight="5" refX="2" refY="2" overflow="visible"><path d="M0 0 L4 2 L0 4 Z" class="ah"/></marker>
      <marker id="am" orient="auto" markerWidth="5" markerHeight="5" refX="2" refY="2" overflow="visible"><path d="M0 0 L4 2 L0 4 Z" class="ah-m"/></marker>
    </defs>

    <!-- Browser zone -->
    <rect class="zone" x="20" y="40" width="320" height="470" rx="12"/>
    <text class="t-zone" x="36" y="64">BROWSER · USER SESSION</text>
    <rect class="box" x="40" y="80" width="280" height="410" rx="10"/>
    <text class="t-h" x="56" y="104">Portal SPA (React)</text>
    <text class="t-d" x="56" y="120">origin: harbor · connect-src 'self'</text>
    <rect class="box-untrusted" x="60" y="134" width="240" height="140" rx="8"/>
    <text class="t-h" x="74" y="156">Extension iframe</text>
    <text class="t-d" x="74" y="176">sandbox="allow-scripts</text>
    <text class="t-d" x="74" y="192">  allow-forms allow-popups"</text>
    <text class="t-d" x="74" y="210">opaque origin, no cookies</text>
    <text class="t-d" x="74" y="228">CSP connect-src 'none'</text>
    <text class="t-d" x="74" y="246">calls harbor.js SDK only</text>
    <text class="t-d" x="74" y="264">lint: no fetch/XHR/storage</text>
    <path class="flow" d="M180 274 V318" marker-end="url(#a)"/>
    <text class="t-lbl" x="190" y="300">postMessage</text>
    <rect class="box" x="60" y="326" width="240" height="150" rx="8"/>
    <text class="t-h" x="74" y="348">bridge.ts</text>
    <text class="t-d" x="74" y="368">extension = which iframe</text>
    <text class="t-d" x="74" y="384">  (message body not trusted)</text>
    <text class="t-d" x="74" y="402">+ X-Harbor-Extension</text>
    <text class="t-d" x="74" y="420">cookie harbor_session:</text>
    <text class="t-d" x="74" y="436">  httpOnly, SameSite=Strict</text>
    <text class="t-d" x="74" y="454">401 → re-login overlay</text>

    <!-- CLI zone -->
    <rect class="zone" x="20" y="540" width="320" height="120" rx="12"/>
    <text class="t-zone" x="36" y="564">CLI · AGENTS</text>
    <text class="t-h" x="36" y="590">harbor CLI / Copilot agent</text>
    <text class="t-d" x="36" y="610">Authorization: Bearer &lt;PAT&gt;</text>
    <text class="t-d" x="36" y="628">no extension: visibility and</text>
    <text class="t-d" x="36" y="644">grant terms drop out</text>

    <!-- Harbor platform -->
    <rect class="zone" x="380" y="40" width="480" height="620" rx="12"/>
    <text class="t-zone" x="396" y="64">HARBOR PLATFORM · FASTAPI · STATELESS</text>
    <rect class="box" x="400" y="80" width="210" height="84" rx="8"/>
    <text class="t-h" x="414" y="102">/ext/{name}/*</text>
    <text class="t-d" x="414" y="120">static files +</text>
    <text class="t-d" x="414" y="136">EXTENSION_CSP header</text>
    <text class="t-d" x="414" y="152">/sdk/harbor.js</text>
    <rect class="box" x="630" y="80" width="210" height="84" rx="8"/>
    <text class="t-h" x="644" y="102">/api/*</text>
    <text class="t-d" x="644" y="120">me · can · extensions</text>
    <text class="t-d" x="644" y="136">connectors · audit</text>
    <text class="t-d" x="644" y="152">/auth/dev-login|logout</text>

    <rect class="gate" x="400" y="182" width="440" height="458" rx="10"/>
    <text class="t-gh" x="416" y="206">/gw/{connector}/{path}</text>
    <text class="t-warn" x="640" y="206" style="fill:#f0a06a">deny → 4xx + reason</text>
    <rect class="step" x="416" y="218" width="408" height="52" rx="6"/>
    <text class="t-gh" x="430" y="239">1  auth.Introspector</text>
    <text class="t-gd" x="430" y="257">cookie | PAT → PAT /introspect · 60 s TTL, stale ok</text>
    <rect class="step" x="416" y="278" width="408" height="52" rx="6"/>
    <text class="t-gh" x="430" y="299">2  paths.check_path</text>
    <text class="t-gd" x="430" y="317">reject .. // %2e %2f %5c %00 \ control chars</text>
    <rect class="step" x="416" y="338" width="408" height="52" rx="6"/>
    <text class="t-gh" x="430" y="359">3  connector match</text>
    <text class="t-gd" x="430" y="377">METHOD /path → capability (* = 1 seg, ** = many)</text>
    <rect class="step" x="416" y="398" width="408" height="52" rx="6"/>
    <text class="t-gh" x="430" y="419">4  authz.authorize</text>
    <text class="t-gd" x="430" y="437">scope ∩ AD ∩ visibility ∩ declared ∩ grant</text>
    <rect class="step" x="416" y="458" width="408" height="52" rx="6"/>
    <text class="t-gh" x="430" y="479">5  observe.RateLimiter</text>
    <text class="t-gd" x="430" y="497">60 / 10 s per user × extension × connector</text>
    <rect class="step-hi" x="416" y="518" width="408" height="52" rx="6"/>
    <text class="t-gh" x="430" y="539">6  forward (httpx)</text>
    <text class="t-gd" x="430" y="557" style="fill:#e3f3f4">header allowlist + credential + X-Harbor-Identity</text>
    <rect class="step" x="416" y="578" width="408" height="52" rx="6"/>
    <text class="t-gh" x="430" y="599">7  observe.Audit</text>
    <text class="t-gd" x="430" y="617">every decision · JSON lines · OTel field names</text>

    <!-- Dependencies -->
    <rect class="zone" x="910" y="40" width="310" height="240" rx="12"/>
    <text class="t-zone" x="926" y="64">PLATFORM DEPENDENCIES</text>
    <rect class="box" x="930" y="80" width="270" height="55" rx="8"/>
    <text class="t-h" x="944" y="102">PAT service</text>
    <text class="t-d" x="944" y="122">/introspect · /session · /revoke</text>
    <rect class="box" x="930" y="145" width="270" height="55" rx="8"/>
    <text class="t-h" x="944" y="167">Secrets service</text>
    <text class="t-d" x="944" y="187">service-account creds → step 6</text>
    <rect class="box" x="930" y="210" width="270" height="55" rx="8"/>
    <text class="t-h" x="944" y="232">OTel Collector</text>
    <text class="t-d" x="944" y="252">audit spans/logs ← step 7</text>

    <!-- Upstreams -->
    <rect class="zone" x="910" y="300" width="310" height="360" rx="12"/>
    <text class="t-zone" x="926" y="324">UPSTREAMS · NATIVE APIS</text>
    <rect class="box" x="930" y="340" width="270" height="55" rx="8"/>
    <text class="t-h" x="944" y="362">harbor-release</text>
    <text class="t-d" x="944" y="382">auth: service-account</text>
    <rect class="box" x="930" y="405" width="270" height="55" rx="8"/>
    <text class="t-h" x="944" y="427">snow (ServiceNow)</text>
    <text class="t-d" x="944" y="447">auth: service-account</text>
    <rect class="box" x="930" y="470" width="270" height="55" rx="8"/>
    <text class="t-h" x="944" y="492">jira</text>
    <text class="t-d" x="944" y="512">auth: service-account</text>
    <rect class="box-accent" x="930" y="535" width="270" height="105" rx="8"/>
    <text class="t-h" x="944" y="557">outage (team service)</text>
    <text class="t-d" x="944" y="577">auth: identity-only</text>
    <text class="t-d" x="944" y="595">verifies JWT sig · aud · exp</text>
    <text class="t-d" x="944" y="613">owns rules (commander only</text>
    <text class="t-d" x="944" y="629">  may resolve)</text>

    <!-- Control plane -->
    <rect class="zone" x="20" y="700" width="1200" height="220" rx="12"/>
    <text class="t-zone" x="36" y="724">CONTROL PLANE · GIT IS THE RELEASE SYSTEM</text>
    <rect class="box" x="40" y="745" width="220" height="150" rx="8"/>
    <text class="t-h" x="54" y="768">Contributor PR</text>
    <text class="t-d" x="54" y="790">extensions/{name}/</text>
    <text class="t-d" x="54" y="808">  extension.yaml</text>
    <text class="t-d" x="54" y="826">  index.html, *.js, *.css</text>
    <text class="t-d" x="54" y="848">built with Copilot from</text>
    <text class="t-d" x="54" y="864">  the extension template</text>
    <rect class="box" x="300" y="745" width="280" height="150" rx="8"/>
    <text class="t-h" x="314" y="768">CI · validate.py + lint.py</text>
    <text class="t-d" x="314" y="790">schema, references, code rules</text>
    <text class="t-d" x="314" y="812">exit 0 → auto-merge</text>
    <text class="t-d" x="314" y="830">exit 2 → platform review</text>
    <text class="t-d" x="314" y="848">  (write cap, wider visibility,</text>
    <text class="t-d" x="314" y="864">   innerHTML)</text>
    <text class="t-d" x="314" y="882">exit 1 → blocked</text>
    <rect class="box" x="620" y="745" width="280" height="150" rx="8"/>
    <text class="t-h" x="634" y="768">main branch</text>
    <text class="t-d" x="634" y="790">connectors/*.yaml   platform</text>
    <text class="t-d" x="634" y="808">config/grants.yaml  platform</text>
    <text class="t-d" x="634" y="826">extensions/*/       contributors</text>
    <text class="t-d" x="634" y="848">every permission traces to</text>
    <text class="t-d" x="634" y="864">  a PR and an approver</text>
    <rect class="box" x="940" y="745" width="260" height="150" rx="8"/>
    <text class="t-h" x="954" y="768">registry.py</text>
    <text class="t-d" x="954" y="790">reloads when file mtimes</text>
    <text class="t-d" x="954" y="808">  change</text>
    <text class="t-d" x="954" y="826">no restart, next request</text>
    <text class="t-d" x="954" y="844">  sees the new config</text>

    <!-- Request flows -->
    <path class="flow" d="M300 401 H392" marker-end="url(#a)"/>
    <path class="flow" d="M340 600 H392" marker-end="url(#a)"/>
    <text class="t-lbl" x="346" y="592">PAT</text>
    <!-- iframe loads code from static host -->
    <path class="flow-dash" d="M400 122 H360 V150 H308" marker-end="url(#am)"/>
    <text class="t-lbl" x="346" y="114" style="fill:#56636f">code</text>
    <!-- step 1 to PAT service -->
    <path class="flow" d="M824 244 H880 V107 H922" marker-end="url(#a)"/>
    <text class="t-lbl" x="852" y="96">introspect</text>
    <!-- step 6 bus to upstreams -->
    <path class="flow" d="M824 544 H895"/>
    <path class="flow" d="M895 367 V587"/>
    <path class="flow" d="M895 367 H922" marker-end="url(#a)"/>
    <path class="flow" d="M895 432 H922" marker-end="url(#a)"/>
    <path class="flow" d="M895 497 H922" marker-end="url(#a)"/>
    <path class="flow" d="M895 587 H922" marker-end="url(#a)"/>
    <!-- control plane -->
    <path class="flow-dash" d="M260 820 H292" marker-end="url(#am)"/>
    <path class="flow-dash" d="M580 820 H612" marker-end="url(#am)"/>
    <path class="flow-dash" d="M900 820 H932" marker-end="url(#am)"/>
    <path class="flow-dash" d="M1070 745 V680 H620 V648" marker-end="url(#am)"/>
    <text class="t-lbl" x="630" y="674" style="fill:#56636f">connectors · extensions · grants</text>
  </svg>