apiVersion: apps/v1
kind: Deployment
metadata:
  name: harbor-extensions
spec:
  replicas: 2
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      annotations:
        gke-gcsfuse/volumes: "true"
    spec:
      serviceAccountName: harbor-extensions
      securityContext:
        runAsNonRoot: true
        fsGroup: 65533
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: harbor-extensions
          ports: [{name: http, containerPort: 8000}]
          env:
            - name: HARBOR_ROOT
              value: /content
          envFrom:
            - secretRef: {name: harbor-extensions-secrets}
          volumeMounts:
            - {name: content, mountPath: /content, readOnly: true}
            - {name: config, mountPath: /etc/harbor-extensions, readOnly: true}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {requests: {cpu: 100m, memory: 192Mi}, limits: {memory: 512Mi}}
      volumes:
        - name: content
          csi:
            driver: gcsfuse.csi.storage.gke.io
            readOnly: true
            volumeAttributes:
              bucketName: REPLACE_WITH_CONTENT_BUCKET
              mountOptions: implicit-dirs,uid=10001,gid=65533
        - name: config
          configMap: {name: harbor-extensions-config}
