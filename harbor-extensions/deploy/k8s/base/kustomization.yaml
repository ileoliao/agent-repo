apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Base for GKE. Set the content bucket, image, PAT service URL and portal origin per environment.
labels:
  - pairs:
      app.kubernetes.io/name: harbor-extensions
      app.kubernetes.io/part-of: harbor
    includeSelectors: true
resources:
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml
images:
  - name: harbor-extensions
    newName: REGION-docker.pkg.dev/PROJECT/harbor/harbor-extensions
    newTag: latest
