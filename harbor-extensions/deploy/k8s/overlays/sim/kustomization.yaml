apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Local kind simulation. Replaces the GKE CSI volume with an rclone FUSE mount of the local object store.
namespace: harbor
resources:
  - ../../base
  - ../../../sim/fuse-object-storage
images:
  # Overlays match the name the base already rewrote to (not the bare "harbor-extensions" from deployment.yaml)
  - name: REGION-docker.pkg.dev/PROJECT/harbor/harbor-extensions
    newName: harbor-extensions
    newTag: sim
patches:
  - target: {kind: ConfigMap, name: harbor-extensions-config}
    patch: |-
      - op: replace
        path: /data/platform.yaml
        value: |
          base_path: /extensions
          pat_service_url: http://pat-service.harbor.svc.cluster.local/pat
          # Substitution value for ${MOCK_BASE} in connectors/*.yaml.
          mock_base: http://upstream-mocks.harbor.svc.cluster.local
          portal_origins:
            - https://harbor.sim.internal:8443
          session_cookie: hx_session
          introspect_ttl: 60
          rate_limit: 30
          rate_window: 10
          allowed_data_classes: [internal]
          dev_login: false
          cookie_secure: true
          audit_sink: stdout
  - target: {kind: Deployment, name: harbor-extensions}
    path: rclone-fuse-patch.yaml
