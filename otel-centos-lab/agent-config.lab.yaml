# Lab agent config (Debian smoke test on this box). Production CentOS uses agent-config.yaml + COLLECTOR_ENDPOINT.
receivers:
  host_metrics:
    collection_interval: 15s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      disk:
      filesystem:
      network:
      load:
      paging:
      processes:

processors:
  resource_detection:
    detectors: [system, env]
    system:
      hostname_sources: [os]
  batch:
    send_batch_size: 1024
    timeout: 5s

exporters:
  otlp_grpc:
    endpoint: 127.0.0.1:4317
    tls:
      insecure: true
  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [host_metrics]
      processors: [resource_detection, batch]
      exporters: [otlp_grpc, debug]
  telemetry:
    logs:
      level: info
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8889
