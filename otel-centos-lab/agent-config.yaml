# Host agent: scrape OS metrics, ship to central collector via OTLP
# Component type names match otelcol-contrib 0.164.0 (non-deprecated).
extensions:
  file_storage:
    directory: /var/lib/otelcol-contrib/file_storage
    create_directory: true

receivers:
  host_metrics:
    collection_interval: 15s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      disk:
        # Skip pseudo/removable devices (loop: snaps & images, ram/zram, sr: CD-ROM)
        exclude:
          devices: ['^(loop|ram|zram|sr|fd)[0-9]+$']
          match_type: regexp
      filesystem:
        # Only real filesystems: container overlays, tmpfs and pseudo filesystems would add series per container/mount
        exclude_fs_types:
          fs_types: [autofs, binfmt_misc, bpf, cgroup, cgroup2, configfs, debugfs, devpts, devtmpfs, fusectl, hugetlbfs, iso9660, mqueue, nsfs, overlay, proc, pstore, rpc_pipefs, securityfs, selinuxfs, squashfs, sysfs, tmpfs, tracefs]
          match_type: strict
        exclude_mount_points:
          mount_points: ['^/(dev|proc|sys|run)($|/)', '^/var/lib/(docker|containers|kubelet)/']
          match_type: regexp
      network:
        # Per-container / per-VM virtual interfaces churn (new names on every restart)
        exclude:
          interfaces: ['^(lo|veth.*|docker.*|br-.*|cni.*|cali.*|flannel.*|cilium.*|lxc.*|virbr.*|vnet.*)$']
          match_type: regexp
      load:
      paging:
      processes:
      process:
        # Production: always filter. No include block = ALL processes (high cardinality, noisy).
        include:
          match_type: strict        # strict = exact process name (default in centos-install.sh); regexp = unanchored regex
          names: [rsyslogd, sshd, otelcol-contrib]
        # Collector runs as non-root: mute EACCES noise for other users' /proc entries.
        mute_process_name_error: true
        mute_process_exe_error: true
        mute_process_io_error: true
        mute_process_user_error: true
        mute_process_cgroup_error: true
        metrics:
          process.cpu.time:
            enabled: true
          process.cpu.utilization:
            enabled: true
          process.memory.usage:
            enabled: true
          process.memory.virtual:
            enabled: true
          process.disk.io:
            enabled: true
  file_log:
    include:
      - /var/log/messages
      - /var/log/secure
    start_at: end
    # Persist read offsets: resume after agent/host restart instead of skipping to the end
    storage: file_storage
    include_file_path: true
    include_file_name: true

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  # Per-process metrics without pid: copy name/owner onto the data points, regroup by them and SUM
  # same-name processes (nginx/php-fpm workers...) into one series instead of letting them overwrite
  # each other. KEEP_PROCESS_PIDS=true skips all of it (one series per process, with process.pid).
  transform/process_identity:
    error_mode: ignore
    metric_statements:
      - context: datapoint
        conditions:
          - IsMatch(metric.name, "^process\\.") and "${env:KEEP_PROCESS_PIDS:-false}" != "true"
        statements:
          - set(datapoint.attributes["process.executable.name"], resource.attributes["process.executable.name"])
          - set(datapoint.attributes["process.owner"], resource.attributes["process.owner"]) where resource.attributes["process.owner"] != nil
          # start_time differs per process; aligning it lets metrics_transform merge the points
          - set(datapoint.start_time_unix_nano, 0)
          - set(datapoint.time, TruncateTime(datapoint.time, Duration("1s")))
      # command_line can carry secrets (e.g. "mysql -pSECRET"): never let it leave the host, debug mode included
      - context: resource
        statements:
          - delete_key(resource.attributes, "process.command_line")
          - delete_key(resource.attributes, "process.command")
      - context: resource
        conditions:
          - "\"${env:KEEP_PROCESS_PIDS:-false}\" != \"true\""
        statements:
          - delete_matching_keys(resource.attributes, "^process\\.")
  groupbyattrs/processes:
    keys: [process.executable.name, process.owner]
  metrics_transform/sum_processes:
    transforms:
      - include: ^process\.memory\.
        match_type: regexp
        action: update
        operations:
          - {action: aggregate_labels, label_set: [], aggregation_type: sum}
      - include: ^process\.cpu\.
        match_type: regexp
        action: update
        operations:
          - {action: aggregate_labels, label_set: [state], aggregation_type: sum}
      - include: process.disk.io
        action: update
        operations:
          - {action: aggregate_labels, label_set: [direction], aggregation_type: sum}
  resource/service:
    attributes:
      - key: service.name
        value: centos-host
        action: insert
  # env first: OTEL_RESOURCE_ATTRIBUTES (host attributes from config management) win over detected values
  resource_detection:
    detectors: [env, system]
    system:
      hostname_sources: [os]
      resource_attributes:
        host.id: {enabled: true}
        host.arch: {enabled: true}
        os.description: {enabled: true}
  # service.instance.id becomes the "instance" label in Mimir/Prometheus; without it all hosts
  # sharing a service.name write into the same series
  transform/instance_id:
    error_mode: ignore
    metric_statements:
      - context: resource
        statements:
          - set(resource.attributes["service.instance.id"], resource.attributes["host.name"]) where resource.attributes["service.instance.id"] == nil
    log_statements:
      - context: resource
        statements:
          - set(resource.attributes["service.instance.id"], resource.attributes["host.name"]) where resource.attributes["service.instance.id"] == nil
  batch:
    send_batch_size: 1024
    timeout: 5s

exporters:
  otlp_grpc:
    endpoint: ${env:COLLECTOR_ENDPOINT}
    tls:
      insecure: true
  # OTLP/HTTP gateway (e.g. https://otel-gw.corp:4318) with the company CA in the system trust store and
  # basic auth handed out as one token: use this exporter in the pipelines instead of otlp_grpc
  # otlp_http:
  #   endpoint: ${env:COLLECTOR_ENDPOINT}
  #   headers:
  #     authorization: "Basic ${env:OTEL_TOKEN}"
  # Lab-only local debug: not wired into the pipelines (production-oriented). To use, uncomment
  # and add `debug` to the pipelines' exporters lists.
  # debug:
  #   verbosity: basic

service:
  extensions: [file_storage]
  pipelines:
    metrics:
      receivers: [host_metrics]
      processors: [memory_limiter, transform/process_identity, groupbyattrs/processes, metrics_transform/sum_processes, resource/service, resource_detection, transform/instance_id, batch]
      exporters: [otlp_grpc]
    logs:
      receivers: [file_log]
      processors: [memory_limiter, resource/service, resource_detection, transform/instance_id, batch]
      exporters: [otlp_grpc]
  telemetry:
    logs:
      level: info
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8889
