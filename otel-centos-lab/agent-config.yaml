# Host agent: scrape OS metrics, ship to central collector via OTLP
# Component type names match otelcol-contrib 0.164.0 (non-deprecated).
receivers:
  host_metrics:
    collection_interval: 15s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      disk:
      filesystem:
      network:
      load:
      paging:
      processes:
      process:
        mute_process_name_error: true
        mute_process_exe_error: true
        mute_process_io_error: true
        mute_process_user_error: true
        mute_process_cgroup_error: true
  file_log:
    include:
      - /var/log/messages
      - /var/log/secure
    start_at: end
    include_file_path: true
    include_file_name: true

processors:
  # Drop per-process PID resource attributes (high cardinality). Set KEEP_PROCESS_PIDS=true to keep them for debugging.
  transform/drop_process_pids:
    error_mode: ignore
    metric_statements:
      - context: resource
        statements:
          - 'delete_key(resource.attributes, "process.pid") where "${env:KEEP_PROCESS_PIDS:-false}" != "true"'
          - 'delete_key(resource.attributes, "process.parent_pid") where "${env:KEEP_PROCESS_PIDS:-false}" != "true"'
  resource_detection:
    detectors: [system, env]
    system:
      hostname_sources: [os]
  batch:
    send_batch_size: 1024
    timeout: 5s

exporters:
  otlp_grpc:
    endpoint: ${env:COLLECTOR_ENDPOINT}
    tls:
      insecure: true
  # Lab-only local debug (optional). Comment out in production.
  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [host_metrics]
      processors: [transform/drop_process_pids, resource_detection, batch]
      exporters: [otlp_grpc, debug]
    logs:
      receivers: [file_log]
      processors: [resource_detection, batch]
      exporters: [otlp_grpc, debug]
  telemetry:
    logs:
      level: info
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8889
