# Central / gateway collector: receive OTLP (metrics + logs), dump for verification
# Verification gateway only: no auth, binds all interfaces -- do NOT expose it to the public internet.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    send_batch_size: 1024
    timeout: 5s

exporters:
  debug:
    verbosity: detailed
    sampling_initial: 50
    sampling_thereafter: 50
  file/metrics:
    path: ./logs/gateway-metrics.json
    rotation:
      max_megabytes: 10
  file/logs:
    path: ./logs/gateway-logs.json
    rotation:
      max_megabytes: 10

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, file/metrics]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, file/logs]
  telemetry:
    logs:
      level: info
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8888
